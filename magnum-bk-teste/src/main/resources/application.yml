spring:
  application:
    name: magnum-bk-teste

  # Configuração do banco (Postgres)
  datasource:
    url: jdbc:postgresql://localhost:5433/magnumbk?currentSchema=public
    username: postgres
    password: 1998
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Configuração do Redis
  cache:
    type: redis
    cache-names: marcasCache, veiculosCache
    redis:
      time-to-live: 60s
      host: localhost
      port: 6379

  # Configuração do Kafka
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: magnum-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # Configuração de segurança (JWT)
  security:
    jwt:
      secret: my-super-secret-key-that-has-32-charsklwjewjeodwsaioaaoansdjwkenkiwkjnefwe65sdcjhbdwdwsdcwkuhwiehwbcwv65487w9d84
      expiration: 3600000
      issuer: magnum-api

# Porta da aplicação
server:
  port: 8080

# Configuração do Flyway (migrações do banco)
flyway:
  enabled: true
  locations: classpath:db/migration
  schemas: public
  baseline-on-migrate: true
  url: jdbc:postgresql://localhost:5433/magnumbk
  user: postgres
  password: 1998

# Configuração do Springdoc (Swagger)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  info:
    title: API de Veículos - Magnum BK
    description: API REST para gerenciamento de veículos, com integração FIPE e processamento assíncrono.
    version: 1.0.0