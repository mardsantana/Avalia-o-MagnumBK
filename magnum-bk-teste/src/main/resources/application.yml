spring:
  application:
    name: magnum-bk-teste

  # Configuração do banco (Postgres)
  datasource:
    url: jdbc:postgresql://localhost:5433/magnumbk?currentSchema=public
    username: postgres
    password: 1998
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # "update" se não usar Flyway, ou "validate" para validação
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Configuração do Redis
  cache:
    type: redis
    cache-names: marcasCache, veiculosCache
    redis:
      time-to-live: 60s
      host: localhost
      port: 6379

  # Configuração do Kafka
  kafka:
    bootstrap-servers: localhost:29092

    # Producer configurado para enviar DTOs em JSON
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # Consumer configurado para receber JSON como DTO
    consumer:
      group-id: magnum-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"  # Permite desserializar qualquer DTO

  # Configuração de segurança (JWT)
  security:
    jwt:
      secret: my-super-secret-key-that-has-32-charsklwjewjeodwsaioaaoansdjwkenkiwkjnefwe65sdcjhbdwdwsdcwkuhwiehwbcwv65487w9d84
      expiration: 3600000 # 1 hora em milissegundos
      issuer: magnum-api

# Porta da aplicação
server:
  port: 8080

# Configuração do Flyway (migrações do banco)
flyway:
  enabled: true
  locations: classpath:db/migration
  schemas: public
  baseline-on-migrate: true
  url: jdbc:postgresql://localhost:5433/magnumbk
  user: postgres
  password: 1998
