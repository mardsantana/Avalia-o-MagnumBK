spring:
  application:
    name: magnum-bk-teste-api2

  # Configuração do banco (Postgres)....banco separado
  datasource:
    url: jdbc:postgresql://localhost:5433/magnumbk?currentSchema=public
    username: postgres
    password: 1998
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # cria tabelas automaticamente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Configuração do Redis
  cache:
    type: redis
    cache-names: marcasCache, veiculosCache
    redis:
      time-to-live: 60s
      host: localhost
      port: 6379

  # Configuração do Kafka
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: api2-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Porta da aplicação - diferente da API-1
server:
  port: 8082

# Configuração do Flyway
flyway:
  enabled: true
  locations: classpath:db/migration.api2
  schemas: public
  baseline-on-migrate: true
  url: jdbc:postgresql://localhost:5433/magnumbk
  user: postgres
  password: 1998
